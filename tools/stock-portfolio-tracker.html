<div class="container py-5">
    <div class="glass-panel p-0 mx-auto overflow-hidden" style="max-width: 1000px;">
        <!-- Header -->
        <div class="bg-dark p-4 border-bottom border-white-10 d-flex justify-content-between align-items-center">
            <div>
                <h4 class="text-white fw-bold mb-1"><i class="fa-solid fa-arrow-trend-up text-success me-2"></i> Portfolio Tracker</h4>
                <p class="text-secondary small mb-0">Live market data via Finnhub</p>
            </div>
            <div class="text-end">
                <small class="text-white-50 text-uppercase fw-bold">Total Value</small>
                <div class="h2 text-white fw-bold mb-0" id="total-val">$0.00</div>
            </div>
        </div>

        <div class="p-4">
            <!-- Add Stock -->
            <form id="add-stock-form" class="row g-2 mb-4">
                <div class="col-md-3">
                    <input type="text" id="symbol-in" class="form-control bg-black border-white-10 text-white" placeholder="Symbol (e.g. AAPL)">
                </div>
                <div class="col-md-3">
                    <input type="number" id="shares-in" class="form-control bg-black border-white-10 text-white" placeholder="Shares">
                </div>
                <div class="col-md-3">
                    <input type="number" id="price-in" class="form-control bg-black border-white-10 text-white" placeholder="Avg Price">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100 fw-bold">Add Position</button>
                </div>
            </form>

            <!-- Table -->
            <div class="table-responsive rounded-3 border border-white-10">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr class="text-secondary text-uppercase small">
                            <th class="bg-black border-bottom border-white-10 ps-4">Ticker</th>
                            <th class="bg-black border-bottom border-white-10 text-end">Price</th>
                            <th class="bg-black border-bottom border-white-10 text-end">Holdings</th>
                            <th class="bg-black border-bottom border-white-10 text-end">Value</th>
                            <th class="bg-black border-bottom border-white-10 text-end pe-4">P&L</th>
                            <th class="bg-black border-bottom border-white-10 w-min"></th>
                        </tr>
                    </thead>
                    <tbody id="stock-list">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
