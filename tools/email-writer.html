<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-0 overflow-hidden">
                <!-- Email Header -->
                <div class="bg-dark p-3 border-bottom border-white-10 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-white fw-bold"><i class="fa-solid fa-paper-plane me-2 text-primary"></i> Smart Compose</h5>
                    <div class="d-flex gap-2">
                        <select id="email-tone" class="form-select form-select-sm bg-black border-white-10 text-white" style="width: 120px;">
                            <option value="professional">Professional</option>
                            <option value="friendly">Friendly</option>
                            <option value="urgent">Urgent</option>
                            <option value="apologetic">Apologetic</option>
                        </select>
                    </div>
                </div>

                <!-- Compose Area -->
                <div class="p-4 bg-dark">
                    <div class="mb-3">
                        <input type="text" id="email-topic" class="form-control bg-transparent border-0 text-white fw-bold fs-5 px-0" placeholder="Subject / Topic..." style="box-shadow: none; border-bottom: 1px solid rgba(255,255,255,0.1) !important;">
                    </div>
                    <div class="mb-3">
                        <textarea id="email-context" class="form-control bg-black border-white-10 text-white p-3 custom-scrollbar" rows="3" placeholder="Key points to include (e.g. asking for a refund, scheduling a meeting...)"></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <button id="generate-btn" class="btn btn-primary px-4"><i class="fa-solid fa-pen-fancy me-2"></i> Write Email</button>
                    </div>
                </div>

                <!-- Output Area -->
                <div class="bg-black p-4 border-top border-white-10 position-relative">
                    <label class="text-white-50 small fw-bold mb-2">Draft</label>
                    <textarea id="email-output" class="form-control bg-transparent border-0 text-secondary p-0 custom-scrollbar" rows="10" style="resize: none; outline: none; box-shadow: none;" placeholder="AI draft will appear here..."></textarea>
                    <button id="copy-btn" class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-3"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>
