<div class="container py-5">
    <div class="glass-panel p-0 mx-auto overflow-hidden" style="max-width: 500px; border: 4px solid #333; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        
        <!-- CRT Screen Effect -->
        <div class="bg-black p-4 position-relative">
            <div class="d-flex justify-content-between text-success font-monospace mb-2" style="font-family: 'VT323', monospace; font-size: 1.5rem;">
                <span>SCORE: <span id="score-display">0</span></span>
                <span id="game-status">READY</span>
            </div>
            
            <canvas id="game-canvas" width="400" height="400" class="border border-success w-100" style="background: #000; box-shadow: inset 0 0 20px rgba(0,255,0,0.2);"></canvas>
            
            <!-- Scanlines -->
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none;"></div>
        </div>

        <!-- Controls -->
        <div class="bg-dark p-4 border-top border-secondary">
            <button id="start-btn" class="btn btn-success w-100 fw-bold mb-4 font-monospace border-2">START GAME</button>
            
            <!-- D-Pad -->
            <div class="d-flex flex-column align-items-center gap-2">
                <button class="btn btn-outline-secondary rounded-circle" id="btn-up" style="width: 50px; height: 50px;"><i class="fa-solid fa-arrow-up"></i></button>
                <div class="d-flex gap-4">
                    <button class="btn btn-outline-secondary rounded-circle" id="btn-left" style="width: 50px; height: 50px;"><i class="fa-solid fa-arrow-left"></i></button>
                    <button class="btn btn-outline-secondary rounded-circle" id="btn-right" style="width: 50px; height: 50px;"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
                <button class="btn btn-outline-secondary rounded-circle" id="btn-down" style="width: 50px; height: 50px;"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
        </div>
    </div>
</div>
