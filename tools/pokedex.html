<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="glass-panel p-4 mb-4">
                <form id="poke-form" class="input-group">
                    <input type="text" id="poke-input" class="form-control bg-dark border-white-10 text-white" placeholder="Pokemon Name or ID...">
                    <button class="btn btn-danger px-4">Find</button>
                </form>
            </div>

            <div id="poke-card" class="d-none animate-fade-in">
                <!-- Main Card -->
                <div class="position-relative overflow-hidden rounded-4 shadow-lg text-white" id="poke-bg" style="background: linear-gradient(135deg, #f87171, #ef4444); height: 600px;">
                    
                    <!-- Top Section (Header + Image) -->
                    <div class="p-4" style="height: 45%;">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h2 class="fw-bold text-capitalize m-0" id="pk-name">Bulbasaur</h2>
                            <span class="fs-5 opacity-75 fw-bold" id="pk-id">#001</span>
                        </div>
                        
                        <div id="pk-types" class="d-flex gap-2 mb-4">
                            <span class="badge bg-white bg-opacity-25 rounded-pill px-3">Grass</span>
                        </div>

                        <div class="position-absolute start-50 translate-middle-x" style="top: 25%; z-index: 10;">
                            <img id="pk-img" src="" style="width: 220px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));">
                        </div>
                    </div>

                    <!-- Bottom Section (Stats Panel) -->
                    <div class="position-absolute bottom-0 start-0 w-100 bg-white text-dark p-4 rounded-top-4 d-flex flex-column" style="height: 55%;">
                        <!-- Physical Stats -->
                        <div class="row g-3 mt-4 mb-2 pb-3 border-bottom">
                            <div class="col-4 text-center border-end">
                                <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Height</small>
                                <strong id="pk-height">0.7m</strong>
                            </div>
                            <div class="col-4 text-center border-end">
                                <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Weight</small>
                                <strong id="pk-weight">6.9kg</strong>
                            </div>
                            <div class="col-4 text-center">
                                <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem;">XP</small>
                                <strong id="pk-xp">64</strong>
                            </div>
                        </div>
                        
                        <!-- Base Stats Bars -->
                        <div class="flex-grow-1 overflow-auto custom-scrollbar" id="pk-stats">
                            <!-- Injected JS -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="poke-error" class="text-center text-danger mt-4 d-none">Pokemon not found</div>
        </div>
    </div>
</div>
