<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-white mb-0"><i class="fa-solid fa-utensils me-2 text-danger"></i> Calorie Tracker</h4>
                    <div class="text-end">
                        <small class="text-secondary d-block">Daily Goal</small>
                        <strong class="text-white" id="goal-display">2000 kcal</strong>
                    </div>
                </div>

                <!-- Progress -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between text-white-50 small mb-1">
                        <span id="consumed-text">0 kcal</span>
                        <span id="remaining-text">2000 left</span>
                    </div>
                    <div class="progress bg-dark border border-white-10" style="height: 10px;">
                        <div class="progress-bar bg-danger" id="progress-bar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Add Food -->
                <form id="add-food-form" class="d-flex gap-2 mb-4">
                    <input type="text" id="food-name" class="form-control bg-dark border-white-10 text-white" placeholder="Food name">
                    <input type="number" id="food-cals" class="form-control bg-dark border-white-10 text-white" placeholder="Cal" style="max-width: 100px;">
                    <button class="btn btn-primary px-3"><i class="fa-solid fa-plus"></i></button>
                </form>

                <!-- List -->
                <div class="custom-scrollbar" style="max-height: 300px; overflow-y: auto;">
                    <ul id="food-list" class="list-group list-group-flush">
                        <!-- Items -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
