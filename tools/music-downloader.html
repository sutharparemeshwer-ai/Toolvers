<!-- tools/music-downloader.html -->
<div class="container-fluid mt-4">
  <h4 class="mb-4 text-center">
    <i class="fa-solid fa-music me-2"></i> Music Downloader
  </h4>

  <div class="card p-3 glass-panel border-white-10">
    <div class="input-group mb-3">
      <input
        type="text"
        id="music-search-input"
        class="form-control bg-dark border-white-10 text-white"
        placeholder="Search for music (e.g., 'epic', 'lofi', 'cinematic')..."
      />
      <button class="btn btn-primary" type="button" id="music-search-btn">
        <i class="fa-solid fa-search"></i>
      </button>
    </div>

    <div id="music-status" class="text-center my-2 text-white-50"></div>

    <div id="music-results-list" class="list-group custom-scrollbar" style="max-height: 500px; overflow-y: auto;">
      <!-- Music tracks will be dynamically inserted here -->
    </div>
    
    <!-- Visualizer (Hidden by default) -->
    <div id="visualizer-container" class="mt-3 p-3 bg-black rounded-3 d-none border border-white-10">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <small class="text-secondary text-uppercase fw-bold">Now Playing</small>
            <div class="music-bars">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>
        <div class="text-white fw-bold" id="now-playing-title">Title</div>
    </div>
  </div>
</div>

<style>
.music-bars { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
.bar { width: 4px; background: var(--primary-color); animation: equalizer 0.5s infinite ease-in-out; }
.bar:nth-child(2n) { animation-duration: 0.7s; }
.bar:nth-child(3n) { animation-duration: 0.4s; }
@keyframes equalizer {
    0% { height: 20%; }
    50% { height: 100%; }
    100% { height: 20%; }
}
.glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); }
</style>
