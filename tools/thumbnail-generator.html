<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-panel p-4">
                <h4 class="text-white fw-bold mb-4 text-center">Thumbnail Creator</h4>
                
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="bg-dark p-3 rounded h-100">
                            <h6 class="text-white small fw-bold mb-3">Layers</h6>
                            
                            <!-- Background -->
                            <div class="mb-3">
                                <label class="text-white-50 small">Background Image</label>
                                <input type="file" id="bg-upload" class="form-control form-control-sm bg-black border-white-10 text-white" accept="image/*">
                            </div>

                            <!-- Main Text -->
                            <div class="mb-3">
                                <label class="text-white-50 small">Title Text</label>
                                <input type="text" id="title-text" class="form-control bg-black border-white-10 text-white" value="AMAZING VIDEO">
                            </div>
                            
                            <!-- Sub Text -->
                            <div class="mb-3">
                                <label class="text-white-50 small">Subtitle</label>
                                <input type="text" id="sub-text" class="form-control bg-black border-white-10 text-white" value="Watch Now!">
                            </div>

                            <button id="download-thumb" class="btn btn-success w-100 mt-3">Download HD</button>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <!-- 16:9 Canvas -->
                        <div class="ratio ratio-16x9 bg-black border border-white-10 shadow-lg position-relative overflow-hidden" id="canvas-container">
                            <canvas id="thumb-canvas" width="1280" height="720" class="w-100 h-100"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
