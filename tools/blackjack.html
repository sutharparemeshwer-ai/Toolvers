<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5 position-relative overflow-hidden" style="background: radial-gradient(circle at center, #1b4d3e, #0f2b23);">
                <!-- Table Felt Texture -->
                <div class="position-absolute top-0 start-0 w-100 h-100 opacity-10" style="background-image: url('https://www.transparenttextures.com/patterns/felt.png'); pointer-events: none;"></div>
                
                <!-- HUD -->
                <div class="d-flex justify-content-between align-items-center mb-5 position-relative z-2">
                    <div class="badge bg-black border border-warning text-warning p-2">
                        <i class="fa-solid fa-coins me-1"></i> <span id="bank-val">1000</span>
                    </div>
                    <h4 class="text-white fw-bold mb-0 text-shadow">BLACKJACK</h4>
                    <div class="badge bg-black border border-white-10 text-white p-2">
                        Bet: <span id="current-bet">0</span>
                    </div>
                </div>

                <!-- Dealer Area -->
                <div class="text-center mb-5 position-relative z-2">
                    <div class="mb-2 text-white-50 small text-uppercase fw-bold">Dealer <span id="dealer-score" class="badge bg-dark ms-2">?</span></div>
                    <div id="dealer-hand" class="d-flex justify-content-center gap-2" style="min-height: 100px;">
                        <!-- Cards -->
                    </div>
                </div>

                <!-- Player Area -->
                <div class="text-center mb-5 position-relative z-2">
                    <div class="mb-2 text-white-50 small text-uppercase fw-bold">You <span id="player-score" class="badge bg-dark ms-2">0</span></div>
                    <div id="player-hand" class="d-flex justify-content-center gap-2" style="min-height: 100px;">
                        <!-- Cards -->
                    </div>
                </div>

                <!-- Controls -->
                <div class="position-relative z-2">
                    <div id="bet-controls" class="d-flex justify-content-center gap-2">
                        <button class="btn btn-outline-warning chip-btn" data-val="10">$10</button>
                        <button class="btn btn-outline-warning chip-btn" data-val="50">$50</button>
                        <button class="btn btn-outline-warning chip-btn" data-val="100">$100</button>
                        <button class="btn btn-success fw-bold px-4" id="deal-btn" disabled>DEAL</button>
                    </div>

                    <div id="action-controls" class="d-flex justify-content-center gap-3 d-none">
                        <button id="hit-btn" class="btn btn-primary px-4 fw-bold">HIT</button>
                        <button id="stand-btn" class="btn btn-danger px-4 fw-bold">STAND</button>
                    </div>
                    
                    <div id="msg-area" class="mt-3 text-center text-white fw-bold h5" style="min-height: 30px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.playing-card {
    width: 70px; height: 100px;
    background: white;
    border-radius: 6px;
    color: black;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 1.5rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: transform 0.3s;
}
.playing-card.red { color: #dc2626; }
.playing-card.black { color: #171717; }
.playing-card .suit-sm {
    position: absolute; font-size: 0.8rem;
}
.playing-card .top-left { top: 4px; left: 4px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.playing-card .bottom-right { bottom: 4px; right: 4px; transform: rotate(180deg); display: flex; flex-direction: column; align-items: center; line-height: 1; }

.playing-card.back {
    background: repeating-linear-gradient(45deg, #b91c1c, #b91c1c 5px, #991b1b 5px, #991b1b 10px);
    border: 2px solid white;

</style>
