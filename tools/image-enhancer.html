<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-panel p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-white fw-bold mb-0"><i class="fa-solid fa-wand-magic-sparkles me-2 text-info"></i> Image Enhancer</h4>
                    <label class="btn btn-primary btn-sm">
                        <i class="fa-solid fa-upload me-2"></i> Upload Image
                        <input type="file" id="img-upload" accept="image/*" hidden>
                    </label>
                </div>

                <!-- Comparison View -->
                <div class="position-relative mx-auto bg-black rounded-3 overflow-hidden shadow-lg border border-white-10" id="compare-container" style="max-width: 800px; height: 500px; display: none;">
                    <!-- Original (Background) -->
                    <img id="img-original" class="w-100 h-100 object-fit-contain" style="opacity: 0.5;">
                    
                    <!-- Enhanced (Foreground with Clip) -->
                    <div id="img-enhanced-wrapper" class="position-absolute top-0 start-0 w-100 h-100" style="width: 50%;">
                        <img id="img-enhanced" class="w-100 h-100 object-fit-contain">
                    </div>

                    <!-- Slider Handle -->
                    <div id="slider-handle" class="position-absolute top-0 bottom-0 bg-white" style="width: 2px; left: 50%; cursor: ew-resize;">
                        <div class="position-absolute top-50 start-50 translate-middle bg-primary rounded-circle text-white d-flex align-items-center justify-content-center shadow" style="width: 30px; height: 30px;">
                            <i class="fa-solid fa-arrows-left-right" style="font-size: 12px;"></i>
                        </div>
                    </div>
                    
                    <div class="position-absolute top-0 start-0 m-3 badge bg-black bg-opacity-50">Original</div>
                    <div class="position-absolute top-0 end-0 m-3 badge bg-primary">Enhanced</div>
                </div>

                <!-- Controls -->
                <div id="controls-panel" class="mt-4 p-3 bg-dark rounded-3 d-none">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="text-white-50 small">Brightness</label>
                            <input type="range" class="form-range" id="range-brightness" min="100" max="150" value="110">
                        </div>
                        <div class="col-md-4">
                            <label class="text-white-50 small">Contrast</label>
                            <input type="range" class="form-range" id="range-contrast" min="100" max="150" value="120">
                        </div>
                        <div class="col-md-4">
                            <label class="text-white-50 small">Saturation</label>
                            <input type="range" class="form-range" id="range-saturate" min="100" max="200" value="130">
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button id="download-btn" class="btn btn-success"><i class="fa-solid fa-download me-2"></i> Save Enhanced</button>
                    </div>
                </div>
                
                <div id="empty-state" class="text-center py-5 text-white-50">
                    <i class="fa-regular fa-image fa-4x mb-3 opacity-25"></i>
                    <p>Upload an image to start editing</p>
                </div>
            </div>
        </div>
    </div>
</div>
