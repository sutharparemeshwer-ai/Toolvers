<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-panel p-0 overflow-hidden">
                <!-- Toolbar -->
                <div class="bg-dark p-3 border-bottom border-white-10 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-white"><i class="fa-solid fa-paragraph me-2 text-info"></i> Zen Writer</h5>
                    <button id="clear-btn" class="btn btn-sm btn-outline-danger">Clear</button>
                </div>

                <!-- Editor -->
                <textarea id="zen-input" class="w-100 bg-black text-white p-5 border-0 custom-scrollbar" style="height: 60vh; resize: none; font-size: 1.2rem; line-height: 1.8; outline: none;" placeholder="Start writing..."></textarea>

                <!-- Status Bar -->
                <div class="bg-dark p-3 border-top border-white-10">
                    <div class="row text-center text-white-50">
                        <div class="col-md-3 border-end border-white-10">
                            <span class="d-block fw-bold text-white fs-4" id="count-words">0</span>
                            <small class="text-uppercase" style="font-size: 0.7rem;">Words</small>
                        </div>
                        <div class="col-md-3 border-end border-white-10">
                            <span class="d-block fw-bold text-white fs-4" id="count-chars">0</span>
                            <small class="text-uppercase" style="font-size: 0.7rem;">Characters</small>
                        </div>
                        <div class="col-md-3 border-end border-white-10">
                            <span class="d-block fw-bold text-white fs-4" id="count-sentences">0</span>
                            <small class="text-uppercase" style="font-size: 0.7rem;">Sentences</small>
                        </div>
                        <div class="col-md-3">
                            <span class="d-block fw-bold text-white fs-4" id="read-time">0m</span>
                            <small class="text-uppercase" style="font-size: 0.7rem;">Read Time</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
