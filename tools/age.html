<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-panel p-5">
                <div class="text-center mb-4">
                    <h3 class="text-white fw-bold">Age Calculator</h3>
                    <p class="text-secondary small">Calculate your exact age and life milestones.</p>
                </div>

                <form id="age-form" class="mb-5">
                    <label class="text-white small fw-bold mb-2">Date of Birth</label>
                    <div class="input-group">
                        <input type="date" id="dob" class="form-control bg-dark border-white-10 text-white">
                        <button type="submit" class="btn btn-primary px-4">Calculate</button>
                    </div>
                    <!-- Error Message Container -->
                    <div id="age-error-msg" class="text-danger small mt-2 text-center d-none"></div>
                </form>

                <div class="row g-3 text-center">
                    <div class="col-4">
                        <div class="bg-white-5 p-3 rounded-3">
                            <h2 class="fw-bold text-white mb-0" id="res-years">--</h2>
                            <small class="text-secondary text-uppercase fw-bold" style="font-size: 0.65rem;">Years</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="bg-white-5 p-3 rounded-3">
                            <h2 class="fw-bold text-white mb-0" id="res-months">--</h2>
                            <small class="text-secondary text-uppercase fw-bold" style="font-size: 0.65rem;">Months</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="bg-white-5 p-3 rounded-3">
                            <h2 class="fw-bold text-white mb-0" id="res-days">--</h2>
                            <small class="text-secondary text-uppercase fw-bold" style="font-size: 0.65rem;">Days</small>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 text-center">
                    <p class="text-white mb-1 fw-bold">Total Days Lived</p>
                    <div class="text-primary font-monospace fs-5" id="total-days">--</div>
                </div>
            </div>
        </div>
    </div>
</div>
