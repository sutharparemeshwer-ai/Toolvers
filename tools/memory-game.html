<div class="container py-5">
    <div class="glass-panel p-4 mx-auto" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="text-white fw-bold mb-0">Memory Match</h4>
            <button class="btn btn-outline-light btn-sm" id="restart-btn"><i class="fa-solid fa-rotate me-1"></i> Restart</button>
        </div>

        <div id="memory-grid" class="d-grid gap-2" style="grid-template-columns: repeat(4, 1fr); perspective: 1000px;">

        </div>
    </div>
</div>
