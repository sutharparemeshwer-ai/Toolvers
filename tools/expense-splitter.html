<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5">
                <div class="text-center mb-5">
                    <h3 class="text-white fw-bold"><i class="fa-solid fa-money-bill-transfer me-2 text-primary"></i> Split It</h3>
                    <p class="text-secondary small">Track shared expenses and settle up easily.</p>
                </div>

                <!-- Step 1: People -->
                <div class="mb-5">
                    <h6 class="text-white small fw-bold text-uppercase mb-3">1. Add People</h6>
                    <div class="input-group mb-3">
                        <input type="text" id="person-name" class="form-control bg-dark border-white-10 text-white" placeholder="Name (e.g. Alice)">
                        <button class="btn btn-outline-light" id="add-person-btn"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="people-container" class="d-flex flex-wrap gap-2">
                        <!-- Chips -->
                    </div>
                </div>

                <!-- Step 2: Expenses -->
                <div class="mb-5">
                    <h6 class="text-white small fw-bold text-uppercase mb-3">2. Add Expense</h6>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <input type="text" id="exp-desc" class="form-control bg-dark border-white-10 text-white" placeholder="Description">
                        </div>
                        <div class="col-3">
                            <input type="number" id="exp-amt" class="form-control bg-dark border-white-10 text-white" placeholder="$0.00">
                        </div>
                        <div class="col-3">
                            <select id="exp-payer" class="form-select bg-dark border-white-10 text-white">
                                <option value="" disabled selected>Payer</option>
                            </select>
                        </div>
                    </div>
                    <button id="add-expense-btn" class="btn btn-primary w-100 mb-3">Add Expense</button>
                    
                    <div id="expense-list" class="list-group custom-scrollbar" style="max-height: 200px; overflow-y: auto;">
                        <!-- List -->
                    </div>
                </div>

                <!-- Step 3: Settlement -->
                <div>
                    <h6 class="text-white small fw-bold text-uppercase mb-3">3. Settlement Plan</h6>
                    <div id="settlement-plan" class="bg-black bg-opacity-25 rounded-3 p-3">
                        <p class="text-white-50 text-center small my-2">Add expenses to see who owes whom.</p>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button id="reset-btn" class="btn btn-sm btn-outline-danger">Reset All</button>
                </div>
            </div>
        </div>
    </div>
</div>
