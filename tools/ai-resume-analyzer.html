<div class="container py-5">
    <div class="row g-4">
        <!-- Input Column -->
        <div class="col-lg-5">
            <div class="glass-panel p-4 h-100">
                <h4 class="text-white fw-bold mb-4"><i class="fa-solid fa-briefcase me-2 text-primary"></i> Resume Analyzer</h4>
                
                <div class="mb-3">
                    <label class="text-white-50 small mb-1">Paste Resume</label>
                    <textarea id="resume-text" class="form-control bg-black border-white-10 text-white small custom-scrollbar" rows="8" placeholder="Experience..."></textarea>
                </div>

                <div class="mb-4">
                    <label class="text-white-50 small mb-1">Job Description</label>
                    <textarea id="job-desc" class="form-control bg-black border-white-10 text-white small custom-scrollbar" rows="8" placeholder="Responsibilities..."></textarea>
                </div>

                <button id="analyze-btn" class="btn btn-primary w-100 py-2">Scan & Match</button>
            </div>
        </div>

        <!-- Dashboard Column -->
        <div class="col-lg-7">
            <div class="glass-panel p-4 h-100 d-flex flex-column justify-content-center align-items-center text-center d-none" id="empty-state">
                <i class="fa-solid fa-magnifying-glass-chart fa-4x text-secondary mb-3 opacity-25"></i>
                <h5 class="text-white">Ready to Analyze</h5>
                <p class="text-secondary small">Paste text on the left to see your ATS score.</p>
            </div>

            <div id="results-dashboard" class="d-none">
                <!-- Score Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="glass-panel p-3 text-center border-top border-4 border-success">
                            <h2 class="display-4 fw-bold text-white mb-0" id="score-val">0%</h2>
                            <small class="text-secondary text-uppercase fw-bold">Match Score</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="glass-panel p-3 text-center border-top border-4 border-info">
                            <h2 class="display-4 fw-bold text-white mb-0" id="keywords-found">0</h2>
                            <small class="text-secondary text-uppercase fw-bold">Keywords Found</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="glass-panel p-3 text-center border-top border-4 border-warning">
                            <h2 class="display-4 fw-bold text-white mb-0" id="keywords-missing">0</h2>
                            <small class="text-secondary text-uppercase fw-bold">Missing</small>
                        </div>
                    </div>
                </div>

                <!-- Keywords Lists -->
                <div class="glass-panel p-4 mb-3">
                    <h6 class="text-white fw-bold border-bottom border-white-10 pb-2 mb-3">Missing Critical Keywords</h6>
                    <div id="missing-list" class="d-flex flex-wrap gap-2">
                        <!-- Badges injected here -->
                    </div>
                </div>

                <div class="glass-panel p-4">
                    <h6 class="text-white fw-bold border-bottom border-white-10 pb-2 mb-3">Matched Skills</h6>
                    <div id="matched-list" class="d-flex flex-wrap gap-2">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
