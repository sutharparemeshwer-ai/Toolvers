<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-4 text-center">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-white fw-bold mb-0">Brick Studio</h4>
                    <div class="badge bg-dark border border-white-10 p-2">SCORE: <span id="br-score">0</span></div>
                </div>

                <div class="position-relative bg-black rounded-3 overflow-hidden border border-white-10" style="height: 500px;">
                    <canvas id="br-canvas" width="800" height="500" class="w-100 h-100"></canvas>
                    
                    <div id="br-overlay" class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-flex flex-column justify-content-center align-items-center">
                        <button id="br-start" class="btn btn-primary btn-lg px-5 fw-bold rounded-pill">START</button>
                        <p class="text-secondary mt-3 small">Use Mouse or Arrow Keys</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
