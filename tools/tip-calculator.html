<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="glass-panel p-5">
                <h4 class="text-center text-white fw-bold mb-4"><i class="fa-solid fa-receipt me-2 text-warning"></i> Bill Splitter</h4>
                
                <div class="mb-4">
                    <label class="text-white-50 small mb-1">Total Bill</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-dark border-white-10 text-secondary">$</span>
                        <input type="number" id="bill-amount" class="form-control bg-dark border-white-10 text-white fw-bold" placeholder="0.00">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-white-50 small mb-2 d-block">Select Tip %</label>
                    <div class="d-flex gap-2 mb-2">
                        <button class="btn btn-outline-light flex-grow-1 tip-btn active" data-tip="10">10%</button>
                        <button class="btn btn-outline-light flex-grow-1 tip-btn" data-tip="15">15%</button>
                        <button class="btn btn-outline-light flex-grow-1 tip-btn" data-tip="20">20%</button>
                    </div>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-black border-white-10 text-secondary">Custom</span>
                        <input type="number" id="custom-tip" class="form-control bg-black border-white-10 text-white" placeholder="%">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="text-white-50 small mb-1">Number of People</label>
                    <div class="input-group">
                        <button class="btn btn-dark border-white-10 text-white" id="dec-people"><i class="fa-solid fa-minus"></i></button>
                        <input type="number" id="people-count" class="form-control bg-black border-white-10 text-white text-center fw-bold" value="2">
                        <button class="btn btn-dark border-white-10 text-white" id="inc-people"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <!-- Result Card -->
                <div class="bg-success p-4 rounded-3 text-center shadow-lg">
                    <small class="text-white text-uppercase fw-bold opacity-75">Total Per Person</small>
                    <h1 class="display-3 fw-bold text-white my-2" id="res-per-person">$0.00</h1>
                    <div class="d-flex justify-content-between px-4 mt-3 border-top border-white-25 pt-3">
                        <span class="text-white small opacity-75">Tip Amount</span>
                        <span class="text-white fw-bold" id="res-tip-total">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between px-4 mt-1">
                        <span class="text-white small opacity-75">Total Bill</span>
                        <span class="text-white fw-bold" id="res-total">$0.00</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
.tip-btn.active { background: white; color: black; border-color: white; }
</style>
