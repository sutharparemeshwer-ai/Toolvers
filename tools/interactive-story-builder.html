<div class="container py-5">
    <div class="row g-4 justify-content-center">
        <!-- Editor Controls -->
        <div class="col-lg-4">
            <div class="glass-panel p-4 h-100 d-flex flex-column">
                <h4 class="text-white fw-bold mb-4"><i class="fa-brands fa-instagram me-2 text-danger"></i> Story Builder</h4>
                
                <!-- Background -->
                <div class="mb-4">
                    <label class="text-white-50 small mb-2">Background</label>
                    <div class="d-flex gap-2 mb-2">
                        <button class="btn btn-outline-light btn-sm flex-grow-1 bg-btn active" data-type="color">Color</button>
                        <button class="btn btn-outline-light btn-sm flex-grow-1 bg-btn" data-type="image">Image</button>
                    </div>
                    <div id="bg-color-control">
                        <input type="color" id="bg-color-picker" class="form-control form-control-color w-100 bg-black border-white-10" value="#833ab4">
                    </div>
                    <div id="bg-image-control" class="d-none">
                        <input type="file" id="bg-image-upload" class="form-control form-control-sm bg-black border-white-10 text-white" accept="image/*">
                    </div>
                </div>

                <!-- Stickers -->
                <div class="mb-4">
                    <label class="text-white-50 small mb-2">Add Stickers</label>
                    <div class="d-grid gap-2">
                        <button class="btn btn-dark border-white-10 text-start add-sticker" data-type="text">
                            <i class="fa-solid fa-font me-2 text-primary"></i> Text
                        </button>
                        <button class="btn btn-dark border-white-10 text-start add-sticker" data-type="poll">
                            <i class="fa-solid fa-square-poll-vertical me-2 text-success"></i> Poll
                        </button>
                        <button class="btn btn-dark border-white-10 text-start add-sticker" data-type="question">
                            <i class="fa-solid fa-question me-2 text-warning"></i> Question Box
                        </button>
                        <button class="btn btn-dark border-white-10 text-start add-sticker" data-type="link">
                            <i class="fa-solid fa-link me-2 text-info"></i> Link Badge
                        </button>
                    </div>
                </div>

                <button id="download-story-btn" class="btn btn-primary w-100 mt-auto py-2 fw-bold">
                    <i class="fa-solid fa-download me-2"></i> Save Story
                </button>
            </div>
        </div>

        <!-- Canvas Preview -->
        <div class="col-lg-5 d-flex justify-content-center">
            <div id="story-canvas-container" class="position-relative overflow-hidden shadow-lg border border-white-10" style="width: 360px; height: 640px; background: #833ab4; border-radius: 12px;">
                <!-- Content Layers -->
                <img id="bg-image-layer" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover d-none">
                <div id="stickers-layer" class="position-absolute top-0 start-0 w-100 h-100"></div>
                
                <!-- Overlay UI (Not exported) -->
                <div class="position-absolute top-0 start-0 w-100 p-3 d-flex justify-content-between text-white-50 small pointer-events-none">
                    <span><i class="fa-solid fa-xmark"></i></span>
                    <span class="fw-bold">Your Story</span>
                    <span><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.pointer-events-none { pointer-events: none; }
.sticker-item {
    position: absolute;
    cursor: grab;
    user-select: none;
    transition: transform 0.1s;
}
.sticker-item:active { cursor: grabbing; transform: scale(1.02); }
.sticker-content {
    background: white;
    color: black;
    padding: 10px 15px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    min-width: 150px;
    text-align: center;
}
/* Sticker Styles */
.sticker-poll { background: white; color: black; border-radius: 12px; overflow: hidden; }
.sticker-poll-header { padding: 15px; font-weight: bold; font-size: 1.1rem; }
.sticker-poll-option { padding: 10px; border-top: 1px solid #eee; font-size: 0.9rem; }

.sticker-question { background: white; color: black; border-radius: 12px; padding: 20px; }
.sticker-question-input { background: #f0f0f0; padding: 10px; border-radius: 8px; color: #999; margin-top: 10px; }

.sticker-link { background: black; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }

.delete-sticker-btn {
    position: absolute; top: -10px; right: -10px;
    width: 24px; height: 24px;
    background: red; color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s;
}
.sticker-item:hover .delete-sticker-btn { opacity: 1; }
</style>
