<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="glass-panel p-5 text-center">
                <div class="mb-4">
                    <i class="fa-solid fa-heart fa-4x text-danger animate-pulse"></i>
                </div>
                <h2 class="text-white fw-bold mb-4">Love Meter</h2>
                
                <form id="love-form" class="mb-4">
                    <div class="mb-3">
                        <input type="text" id="name1" class="form-control bg-dark border-white-10 text-white text-center py-3" placeholder="First Name" required>
                    </div>
                    <div class="mb-4">
                        <input type="text" id="name2" class="form-control bg-dark border-white-10 text-white text-center py-3" placeholder="Partner's Name" required>
                    </div>
                    <button class="btn btn-danger w-100 py-3 fw-bold shadow-lg">Calculate Compatibility</button>
                </form>

                <div id="result-card" class="d-none animate-fade-in">
                    <div class="display-1 fw-bold text-white mb-2" id="score">0%</div>
                    <div class="progress bg-dark mb-3" style="height: 10px;">
                        <div class="progress-bar bg-danger" id="score-bar" style="width: 0%"></div>
                    </div>
                    <p class="text-white-50 lead" id="msg">--</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.animate-pulse { animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
</style>
