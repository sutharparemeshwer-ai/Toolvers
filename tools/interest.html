<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5">
                <div class="text-center mb-5">
                    <h2 class="text-white fw-bold"><i class="fa-solid fa-chart-line me-2 text-primary"></i> Compound Interest</h2>
                    <p class="text-secondary">Visualize the power of compounding over time.</p>
                </div>

                <div class="row g-4 align-items-center">
                    <div class="col-md-6">
                        <form id="interest-form">
                            <div class="mb-3">
                                <label class="text-white small fw-bold mb-1">Principal ($)</label>
                                <input type="number" id="principal" class="form-control bg-dark border-white-10 text-white" value="5000">
                            </div>
                            <div class="mb-3">
                                <label class="text-white small fw-bold mb-1">Rate (%)</label>
                                <input type="number" id="rate" class="form-control bg-dark border-white-10 text-white" value="7" step="0.1">
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="text-white small fw-bold mb-1">Years</label>
                                    <input type="number" id="time" class="form-control bg-dark border-white-10 text-white" value="10">
                                </div>
                                <div class="col-6">
                                    <label class="text-white small fw-bold mb-1">Frequency</label>
                                    <select id="compounding-frequency" class="form-select bg-dark border-white-10 text-white">
                                        <option value="1">Annually</option>
                                        <option value="12" selected>Monthly</option>
                                        <option value="365">Daily</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn btn-primary w-100">Calculate Growth</button>
                        </form>
                    </div>

                    <div class="col-md-6">
                        <div class="bg-dark rounded-3 p-4 border border-white-10 h-100 d-flex flex-column justify-content-center text-center">
                            <small class="text-secondary text-uppercase fw-bold mb-2">Future Value</small>
                            <h2 class="display-5 fw-bold text-success mb-3" id="future-value">$0.00</h2>
                            
                            <div class="d-flex justify-content-between px-3 border-top border-white-10 pt-3">
                                <div>
                                    <div class="small text-secondary">Invested</div>
                                    <div class="fw-bold text-white" id="summary-principal">$0.00</div>
                                </div>
                                <div>
                                    <div class="small text-secondary">Profit</div>
                                    <div class="fw-bold text-primary" id="total-interest">$0.00</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
