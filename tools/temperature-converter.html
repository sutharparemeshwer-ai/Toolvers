<div class="container py-5">
    <div class="glass-panel p-5 mx-auto" style="max-width: 600px;">
        <h4 class="text-center text-white fw-bold mb-5"><i class="fa-solid fa-temperature-three-quarters me-2 text-danger"></i> Temp Converter</h4>
        
        <div class="d-flex flex-column gap-4">
            
            <!-- Celsius -->
            <div>
                <label class="text-white fw-bold mb-2 d-flex justify-content-between">
                    <span>Celsius</span>
                    <span id="c-val" class="text-info">0°C</span>
                </label>
                <input type="range" class="form-range" id="c-range" min="-100" max="100" value="0">
                <input type="number" class="form-control bg-dark border-white-10 text-white mt-2" id="c-input" value="0">
            </div>

            <div class="text-center text-secondary"><i class="fa-solid fa-arrow-down-up"></i></div>

            <!-- Fahrenheit -->
            <div>
                <label class="text-white fw-bold mb-2 d-flex justify-content-between">
                    <span>Fahrenheit</span>
                    <span id="f-val" class="text-warning">32°F</span>
                </label>
                <input type="range" class="form-range" id="f-range" min="-148" max="212" value="32">
                <input type="number" class="form-control bg-dark border-white-10 text-white mt-2" id="f-input" value="32">
            </div>

        </div>
    </div>
</div>
