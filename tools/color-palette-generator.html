<div class="container py-5">
    <div class="glass-panel p-5 mx-auto" style="max-width: 900px;">
        <div class="text-center mb-5">
            <h2 class="text-white fw-bold"><i class="fa-solid fa-palette me-2 text-primary"></i> Color Studio</h2>
            <p class="text-secondary">Generate harmonious color schemes instantly.</p>
        </div>

        <div class="row g-5">
            <!-- Controls -->
            <div class="col-md-4 border-end border-white-10">
                <div class="mb-4">
                    <label class="text-white small fw-bold mb-2">Base Color</label>
                    <div class="input-group">
                        <input type="color" id="base-color-picker" class="form-control form-control-color bg-dark border-white-10" value="#3b82f6" title="Choose your color">
                        <input type="text" id="base-color-text" class="form-control bg-dark border-white-10 text-white font-monospace" value="#3b82f6">
                    </div>
                </div>
                <button id="random-color-btn" class="btn btn-outline-light w-100 mb-3"><i class="fa-solid fa-shuffle me-2"></i> Randomize</button>
                
                <div class="p-3 bg-white-5 rounded mt-4">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="small text-secondary">RGB</span>
                        <span class="small text-white font-monospace" id="val-rgb">--</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="small text-secondary">HSL</span>
                        <span class="small text-white font-monospace" id="val-hsl">--</span>
                    </div>
                </div>
            </div>

            <!-- Palettes -->
            <div class="col-md-8">
                <div class="mb-4">
                    <h6 class="text-white small fw-bold text-uppercase mb-3">Monochromatic</h6>
                    <div id="monochromatic-palette" class="palette-row d-flex rounded overflow-hidden"></div>
                </div>
                <div class="mb-4">
                    <h6 class="text-white small fw-bold text-uppercase mb-3">Analogous</h6>
                    <div id="analogous-palette" class="palette-row d-flex rounded overflow-hidden"></div>
                </div>
                <div class="mb-4">
                    <h6 class="text-white small fw-bold text-uppercase mb-3">Complementary</h6>
                    <div id="complementary-palette" class="palette-row d-flex rounded overflow-hidden"></div>
                </div>
                <div class="mb-4">
                    <h6 class="text-white small fw-bold text-uppercase mb-3">Triadic</h6>
                    <div id="triadic-palette" class="palette-row d-flex rounded overflow-hidden"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.palette-row { height: 60px; cursor: pointer; }
.color-swatch { flex: 1; transition: flex 0.2s; position: relative; }
.color-swatch:hover { flex: 1.5; }
.color-swatch::after {
    content: attr(data-color);
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    text-align: center;
    font-size: 10px;
    background: rgba(0,0,0,0.5);
    color: white;
    opacity: 0;
    transition: opacity 0.2s;
}
.color-swatch:hover::after { opacity: 1; }
</style>
