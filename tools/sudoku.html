<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-panel p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-white fw-bold mb-0">Sudoku</h4>
                    <div class="d-flex gap-2">
                        <select id="diff-select" class="form-select form-select-sm bg-dark border-white-10 text-white">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                        <button id="new-btn" class="btn btn-sm btn-primary">New</button>
                    </div>
                </div>

                <div id="sudo-grid" class="sudo-board mx-auto mb-4">
                    <!-- Cells -->
                </div>

                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <button class="btn btn-outline-light num-btn">1</button>
                    <button class="btn btn-outline-light num-btn">2</button>
                    <button class="btn btn-outline-light num-btn">3</button>
                    <button class="btn btn-outline-light num-btn">4</button>
                    <button class="btn btn-outline-light num-btn">5</button>
                    <button class="btn btn-outline-light num-btn">6</button>
                    <button class="btn btn-outline-light num-btn">7</button>
                    <button class="btn btn-outline-light num-btn">8</button>
                    <button class="btn btn-outline-light num-btn">9</button>
                    <button class="btn btn-outline-danger num-btn" data-val="0"><i class="fa-solid fa-eraser"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.sudo-board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 1px;
    background: #475569;
    border: 2px solid #475569;
    width: 100%;
    aspect-ratio: 1/1;
    max-width: 400px;
}
.sudo-cell {
    background: #0f172a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    cursor: pointer;
}
.sudo-cell:nth-child(3n) { border-right: 2px solid #475569; }
.sudo-cell:nth-child(9n) { border-right: none; }
.sudo-board .sudo-cell:nth-child(n+19):nth-child(-n+27),
.sudo-board .sudo-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #475569; }

.sudo-cell.selected { background: rgba(59, 130, 246, 0.3); }
.sudo-cell.prefilled { font-weight: bold; color: #94a3b8; pointer-events: none; }
.sudo-cell.error { color: #ef4444; }
.num-btn { width: 40px; height: 40px; border-radius: 50%; padding: 0; }
</style>
