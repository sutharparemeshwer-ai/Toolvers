<div class="container py-5">
    <!-- Header -->
    <div class="text-center mb-5">
        <h1 class="hero-title-modern fs-2">Full Tool Catalog</h1>
        <p class="text-secondary">Browse our complete collection of <span id="total-tools-count">100+</span> utilities.</p>
    </div>

    <!-- Search -->
    <div class="search-wrapper-modern mb-5">
        <i class="fa-solid fa-magnifying-glass search-icon-absolute"></i>
        <input type="text" id="all-tools-search-input" class="search-input-modern" placeholder="Filter tools by name, tag, or category...">
    </div>

    <!-- Grid -->
    <div id="all-tools-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <!-- JS populates this -->
    </div>

    <!-- Empty State -->
    <div id="no-tools-found" class="text-center py-5 d-none">
        <div class="glass-panel d-inline-block p-4 rounded-circle mb-3">
             <i class="fa-solid fa-ghost fa-2x text-secondary"></i>
        </div>
        <h4 class="text-white">No tools found</h4>
        <p class="text-secondary">Try adjusting your search query.</p>
    </div>
</div>
