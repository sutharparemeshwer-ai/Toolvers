<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-white fw-bold mb-0"><i class="fa-solid fa-brain text-info me-2"></i> Trivia Master</h4>
                    <span class="badge bg-dark border border-white-10 text-white p-2">Score: <span id="score-val">0</span></span>
                </div>

                <div id="quiz-container" class="text-center">
                    <div class="spinner-border text-primary my-5" id="loader"></div>
                    
                    <div id="question-box" class="d-none">
                        <div class="mb-4">
                            <span class="text-secondary small text-uppercase fw-bold" id="q-category">Category</span>
                            <h3 class="text-white mt-2" id="q-text">Question?</h3>
                        </div>
                        
                        <div class="d-grid gap-3" id="options-list">
                            <!-- Buttons -->
                        </div>
                    </div>

                    <div id="result-box" class="d-none">
                        <h2 class="text-white fw-bold mb-3">Quiz Complete!</h2>
                        <div class="display-1 fw-bold text-primary mb-4" id="final-score">0/10</div>
                        <button class="btn btn-light btn-lg px-5" onclick="window.location.reload()">Play Again</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.quiz-opt {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    text-align: left;
    padding: 1rem 1.5rem;
    border-radius: 8px;
    transition: all 0.2s;
}
.quiz-opt:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
.quiz-opt.correct { background: #10b981 !important; border-color: #10b981; }
.quiz-opt.wrong { background: #ef4444 !important; border-color: #ef4444; }
</style>
