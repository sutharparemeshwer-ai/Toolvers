<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-panel p-5 text-center">
                <h3 class="text-white fw-bold mb-4"><i class="fa-solid fa-weight-scale me-2 text-warning"></i> BMI Calculator</h3>
                
                <form id="bmi-form" class="mb-4">
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="text-white-50 small mb-1">Weight</label>
                            <div class="input-group">
                                <input type="number" id="weight" class="form-control bg-dark border-white-10 text-white" placeholder="0">
                                <select id="weight-unit" class="form-select bg-dark border-white-10 text-white" style="max-width: 70px;">
                                    <option value="kg">kg</option>
                                    <option value="lbs">lbs</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="text-white-50 small mb-1">Height</label>
                            <div class="input-group">
                                <input type="number" id="height" class="form-control bg-dark border-white-10 text-white" placeholder="0">
                                <select id="height-unit" class="form-select bg-dark border-white-10 text-white" style="max-width: 70px;">
                                    <option value="cm">cm</option>
                                    <option value="m">m</option>
                                    <option value="ft">ft</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-warning w-100 fw-bold">Calculate BMI</button>
                </form>

                <div class="py-4 border-top border-white-10">
                    <small class="text-secondary text-uppercase fw-bold">Your Score</small>
                    <h1 class="display-3 fw-bold text-white mb-2" id="bmi-result">--</h1>
                    <span class="badge bg-dark border border-white-10 px-3 py-2 rounded-pill" id="bmi-status">Enter details</span>
                </div>
            </div>
        </div>
    </div>
</div>
