<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-panel p-5">
                <div class="text-center mb-5">
                    <h3 class="text-white fw-bold"><i class="fa-solid fa-calendar-days me-2 text-primary"></i> Date Studio</h3>
                    <p class="text-secondary small">Calculate the exact duration between two dates.</p>
                </div>

                <form id="date-diff-form" class="mb-5">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="text-white small fw-bold mb-2">Start Date</label>
                            <input type="date" id="start-date" class="form-control bg-dark border-white-10 text-white">
                        </div>
                        <div class="col-md-6">
                            <label class="text-white small fw-bold mb-2">End Date</label>
                            <input type="date" id="end-date" class="form-control bg-dark border-white-10 text-white">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4 fw-bold">Calculate Duration</button>
                </form>

                <div id="results-grid" class="row g-3 text-center d-none">
                    <div class="col-4">
                        <div class="bg-white-5 p-3 rounded-3 h-100 d-flex flex-column justify-content-center">
                            <h3 class="fw-bold text-white mb-0" id="res-years">0</h3>
                            <small class="text-secondary text-uppercase fw-bold" style="font-size: 0.65rem;">Years</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="bg-white-5 p-3 rounded-3 h-100 d-flex flex-column justify-content-center">
                            <h3 class="fw-bold text-white mb-0" id="res-months">0</h3>
                            <small class="text-secondary text-uppercase fw-bold" style="font-size: 0.65rem;">Months</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="bg-white-5 p-3 rounded-3 h-100 d-flex flex-column justify-content-center">
                            <h3 class="fw-bold text-white mb-0" id="res-days">0</h3>
                            <small class="text-secondary text-uppercase fw-bold" style="font-size: 0.65rem;">Days</small>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <div class="bg-dark p-3 rounded-3 border border-white-10 mt-2">
                            <div class="d-flex justify-content-between px-4">
                                <div class="text-start">
                                    <small class="text-secondary d-block">Total Weeks</small>
                                    <span class="text-white fw-bold" id="total-weeks">0</span>
                                </div>
                                <div class="text-end">
                                    <small class="text-secondary d-block">Total Days</small>
                                    <span class="text-white fw-bold" id="total-days">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
