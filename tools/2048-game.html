<div class="container py-5">
    <div class="glass-panel p-4 mx-auto text-center" style="max-width: 500px; border: 2px solid rgba(255,255,255,0.1);">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-white mb-0" style="font-family: 'Courier New', monospace; letter-spacing: -2px; font-size: 3rem; text-shadow: 0 0 10px rgba(255,255,255,0.5);">2048</h2>
            </div>
            <div class="bg-dark border border-white-10 rounded p-2 px-3 text-end">
                <small class="text-secondary text-uppercase d-block" style="font-size: 0.6rem;">Score</small>
                <span class="fw-bold text-white fs-4" id="game-2048-score">0</span>
            </div>
        </div>

        <div class="position-relative mx-auto bg-dark border border-white-10 rounded p-2" style="width: 340px; height: 340px;">
            <div id="game-2048-board" class="d-grid" style="grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; width: 100%; height: 100%;">
                <!-- Tiles -->
            </div>
            
            <!-- Game Over Overlay -->
            <div id="game-2048-over-message" class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-90 d-flex flex-column justify-content-center align-items-center d-none z-3">
                <h2 class="text-white fw-bold mb-3">Game Over!</h2>
                <button id="try-again-btn" class="btn btn-warning px-4 fw-bold">Try Again</button>
            </div>
        </div>

        <div class="mt-4 d-flex justify-content-between align-items-center">
            <small class="text-secondary"><i class="fa-solid fa-arrows-up-down-left-right me-1"></i> Use Arrow Keys</small>
            <button id="new-game-2048-btn" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-rotate-right me-1"></i> Restart</button>
        </div>
    </div>
</div>

    background: rgba(255,255,255,0.1);
