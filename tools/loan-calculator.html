<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-panel p-5">
                <div class="text-center mb-5">
                    <h2 class="text-white fw-bold"><i class="fa-solid fa-file-invoice-dollar me-2 text-success"></i> Loan Calculator</h2>
                    <p class="text-secondary">Calculate monthly payments and amortization.</p>
                </div>

                <div class="row g-5">
                    <!-- Input Section -->
                    <div class="col-md-5 border-end border-white-10">
                        <form id="loan-form">
                            <div class="mb-4">
                                <label class="text-white small fw-bold mb-2">Loan Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-white-10 text-secondary">$</span>
                                    <input type="number" id="loan-amount" class="form-control bg-dark border-white-10 text-white" value="10000">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="text-white small fw-bold mb-2">Interest Rate (%)</label>
                                <div class="input-group">
                                    <input type="number" id="interest-rate" class="form-control bg-dark border-white-10 text-white" value="5" step="0.1">
                                    <span class="input-group-text bg-dark border-white-10 text-secondary">%</span>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="text-white small fw-bold mb-2">Loan Term (Years)</label>
                                <input type="number" id="loan-term" class="form-control bg-dark border-white-10 text-white" value="5">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-lg">Calculate Payment</button>
                        </form>
                    </div>

                    <!-- Result Section -->
                    <div class="col-md-7">
                        <div class="text-center py-4 bg-white-5 rounded-3 mb-4">
                            <small class="text-secondary text-uppercase fw-bold">Monthly Payment</small>
                            <h1 class="display-4 fw-bold text-white mb-0 mt-2" id="monthly-payment">$0.00</h1>
                        </div>

                        <div class="row g-3 text-center">
                            <div class="col-4">
                                <small class="text-secondary d-block mb-1">Principal</small>
                                <h6 class="text-white fw-bold" id="total-principal">$0.00</h6>
                            </div>
                            <div class="col-4 border-start border-end border-white-10">
                                <small class="text-secondary d-block mb-1">Interest</small>
                                <h6 class="text-danger fw-bold" id="total-interest">$0.00</h6>
                            </div>
                            <div class="col-4">
                                <small class="text-secondary d-block mb-1">Total Cost</small>
                                <h6 class="text-success fw-bold" id="total-payment">$0.00</h6>
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-4 border-top border-white-10">
                             <button class="btn btn-outline-light w-100 btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#amortization-collapse">
                                 View Amortization Schedule <i class="fa-solid fa-chevron-down ms-2"></i>
                             </button>
                        </div>
                    </div>
                </div>
                
                <!-- Schedule -->
                <div class="collapse mt-4" id="amortization-collapse">
                    <div class="table-responsive custom-scrollbar" style="max-height: 400px;">
                        <table class="table table-dark table-hover mb-0 small">
                            <thead class="sticky-top bg-dark">
                                <tr>
                                    <th class="py-3">Month</th>
                                    <th class="py-3 text-end">Payment</th>
                                    <th class="py-3 text-end">Principal</th>
                                    <th class="py-3 text-end">Interest</th>
                                    <th class="py-3 text-end">Balance</th>
                                </tr>
                            </thead>
                            <tbody id="amortization-tbody" class="border-top border-white-10">
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
