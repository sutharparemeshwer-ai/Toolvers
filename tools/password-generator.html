<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5 position-relative overflow-hidden">
                <!-- Background Decoration -->
                <div class="position-absolute top-0 end-0 p-5 opacity-10">
                    <i class="fa-solid fa-shield-halved fa-10x text-white"></i>
                </div>

                <h3 class="fw-bold text-white mb-4 position-relative z-2">
                    <i class="fa-solid fa-user-shield me-2 text-success"></i> Security Center
                </h3>

                <!-- Output Display -->
                <div class="position-relative z-2 mb-4">
                    <label class="text-white-50 small text-uppercase fw-bold mb-2">Generated Password</label>
                    <div class="input-group">
                        <input type="text" id="password-output" class="form-control form-control-lg bg-dark text-white font-monospace border-white-10 py-3" style="font-size: 1.5rem; letter-spacing: 2px;" readonly value="CLICK GENERATE">
                        <button class="btn btn-primary px-4" id="copy-btn"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>

                <!-- Strength Meter -->
                <div class="mb-5 position-relative z-2">
                    <div class="d-flex justify-content-between text-white-50 small mb-1">
                        <span>Strength Analysis</span>
                        <span id="strength-text" class="fw-bold text-danger">Weak</span>
                    </div>
                    <div class="progress" style="height: 6px; background: rgba(255,255,255,0.1);">
                        <div id="strength-bar" class="progress-bar bg-danger" role="progressbar" style="width: 10%"></div>
                    </div>
                    <small id="entropy-text" class="text-secondary mt-1 d-block">Entropy: 0 bits</small>
                </div>

                <!-- Controls -->
                <form id="generator-form" class="position-relative z-2">
                    <div class="mb-4">
                         <div class="d-flex justify-content-between text-white mb-2">
                             <label class="fw-bold">Length</label>
                             <span id="length-value" class="h5 mb-0 text-primary">16</span>
                         </div>
                         <input type="range" class="form-range" min="8" max="64" value="16" id="length-slider">
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="glass-panel p-3 w-100 d-flex align-items-center cursor-pointer hover-lift">
                                <input class="form-check-input me-3" type="checkbox" id="include-uppercase" checked>
                                <span class="text-white">Uppercase (A-Z)</span>
                            </label>
                        </div>
                        <div class="col-md-6">
                            <label class="glass-panel p-3 w-100 d-flex align-items-center cursor-pointer hover-lift">
                                <input class="form-check-input me-3" type="checkbox" id="include-numbers" checked>
                                <span class="text-white">Numbers (0-9)</span>
                            </label>
                        </div>
                        <div class="col-md-6">
                            <label class="glass-panel p-3 w-100 d-flex align-items-center cursor-pointer hover-lift">
                                <input class="form-check-input me-3" type="checkbox" id="include-symbols" checked>
                                <span class="text-white">Symbols (!@#$)</span>
                            </label>
                        </div>
                        <div class="col-md-6">
                             <button type="submit" class="btn btn-success w-100 h-100 fw-bold py-3 hover-lift shadow-lg">
                                <i class="fa-solid fa-rotate me-2"></i> GENERATE
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.font-monospace { font-family: 'Fira Code', monospace; }
.border-white-10 { border-color: rgba(255,255,255,0.1) !important; }
.cursor-pointer { cursor: pointer; }
.hover-lift:hover { transform: translateY(-2px); transition: transform 0.2s; background: rgba(255,255,255,0.05); }
.opacity-10 { opacity: 0.1; }
</style>
