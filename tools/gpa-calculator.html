<div class="container py-5">
    <div class="glass-panel p-5 mx-auto" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h3 class="text-white fw-bold mb-1"><i class="fa-solid fa-graduation-cap me-2 text-success"></i> GPA Dashboard</h3>
                <p class="text-secondary small mb-0">Track your academic performance.</p>
            </div>
            <div class="text-end">
                <small class="text-secondary text-uppercase fw-bold d-block mb-1">Cumulative GPA</small>
                <div class="d-inline-block px-4 py-2 bg-success bg-opacity-10 border border-success rounded-pill">
                    <h2 class="fw-bold text-success mb-0" id="gpa-display">0.00</h2>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Course List -->
            <div class="col-lg-8">
                <div class="bg-dark rounded-3 border border-white-10 overflow-hidden">
                    <div class="p-3 border-bottom border-white-10 bg-black bg-opacity-25 d-flex fw-bold text-white-50 small text-uppercase">
                        <div style="width: 40%">Course</div>
                        <div style="width: 20%">Credits</div>
                        <div style="width: 20%">Grade</div>
                        <div style="width: 20%"></div>
                    </div>
                    <div id="course-list" class="custom-scrollbar" style="max-height: 300px; overflow-y: auto;">
                        <!-- Items -->
                    </div>
                    <div class="p-3 border-top border-white-10">
                        <button class="btn btn-outline-danger btn-sm w-100" id="clear-btn">Clear All</button>
                    </div>
                </div>
            </div>

            <!-- Add Form -->
            <div class="col-lg-4">
                <div class="bg-dark p-4 rounded-3 border border-white-10 h-100">
                    <h6 class="text-white fw-bold mb-3">Add Course</h6>
                    <form id="add-form">
                        <div class="mb-3">
                            <label class="text-white-50 small mb-1">Name</label>
                            <input type="text" id="c-name" class="form-control bg-black border-white-10 text-white" placeholder="Math 101">
                        </div>
                        <div class="mb-3">
                            <label class="text-white-50 small mb-1">Credits</label>
                            <input type="number" id="c-credits" class="form-control bg-black border-white-10 text-white" value="3">
                        </div>
                        <div class="mb-4">
                            <label class="text-white-50 small mb-1">Grade</label>
                            <select id="c-grade" class="form-select bg-black border-white-10 text-white">
                                <option value="4.0">A (4.0)</option>
                                <option value="3.7">A- (3.7)</option>
                                <option value="3.3">B+ (3.3)</option>
                                <option value="3.0">B (3.0)</option>
                                <option value="2.7">B- (2.7)</option>
                                <option value="2.3">C+ (2.3)</option>
                                <option value="2.0">C (2.0)</option>
                                <option value="1.0">D (1.0)</option>
                                <option value="0.0">F (0.0)</option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100">Add Entry</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
