<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="calculator-modern">
        <!-- Display -->
        <div class="calculator-display-wrapper mb-4">
             <input type="text" class="calculator-display" id="display" disabled value="0">
        </div>

        <!-- Keypad -->
        <div class="calculator-keys" id="calculator-body">
            <button type="button" class="key key-op-light" data-action="clear">AC</button>
            <button type="button" class="key key-op-light" data-action="negate">+/-</button>
            <button type="button" class="key key-op-light" data-action="percent">%</button>
            <button type="button" class="key key-op-primary" data-action="operator" data-value="/">÷</button>

            <button type="button" class="key" data-action="number" data-value="7">7</button>
            <button type="button" class="key" data-action="number" data-value="8">8</button>
            <button type="button" class="key" data-action="number" data-value="9">9</button>
            <button type="button" class="key key-op-primary" data-action="operator" data-value="*">×</button>

            <button type="button" class="key" data-action="number" data-value="4">4</button>
            <button type="button" class="key" data-action="number" data-value="5">5</button>
            <button type="button" class="key" data-action="number" data-value="6">6</button>
            <button type="button" class="key key-op-primary" data-action="operator" data-value="-">-</button>

            <button type="button" class="key" data-action="number" data-value="1">1</button>
            <button type="button" class="key" data-action="number" data-value="2">2</button>
            <button type="button" class="key" data-action="number" data-value="3">3</button>
            <button type="button" class="key key-op-primary" data-action="operator" data-value="+">+</button>

            <button type="button" class="key key-zero" data-action="number" data-value="0">0</button>
            <button type="button" class="key" data-action="decimal" data-value=".">.</button>
            <button type="button" class="key key-equal" data-action="calculate">=</button>
        </div>
    </div>
</div>

<style>
.calculator-modern {
    background: var(--bg-card-dark);
    padding: 2rem;
    border-radius: 2rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    width: 350px;
}

.calculator-display-wrapper {
    background: rgba(0,0,0,0.2);
    border-radius: 1rem;
    padding: 1rem;
    margin-bottom: 2rem;
    text-align: right;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
}

.calculator-display {
    width: 100%;
    background: transparent;
    border: none;
    color: white;
    font-size: 3rem;
    text-align: right;
    font-weight: 300;
    font-family: 'Inter', sans-serif;
}

.calculator-keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
}

.key {
    height: 60px;
    border-radius: 50%;
    border: none;
    font-size: 1.25rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    background: #334155;
    color: white;
    box-shadow: 0 4px 0 #1e293b;
}

.key:active {
    transform: translateY(4px);
    box-shadow: none;
}

.key-op-light {
    background: #94a3b8;
    color: #0f172a;
    box-shadow: 0 4px 0 #64748b;
}

.key-op-primary {
    background: #6366f1;
    color: white;
    box-shadow: 0 4px 0 #4338ca;
}

.key-equal {
    background: #22c55e;
    box-shadow: 0 4px 0 #15803d;
}

.key-zero {
    grid-column: span 2;
    border-radius: 30px;
}
</style>
